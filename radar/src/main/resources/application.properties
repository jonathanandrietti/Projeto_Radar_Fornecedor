# Configurações de conexão com o banco de dados SQLite
# Usa caminho relativo ao diretório do projeto (parent do working directory)
spring.datasource.url=jdbc:sqlite:./DBLRadar.db
spring.datasource.driverClassName=org.sqlite.JDBC

# Configurações adicionais de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=H2

# Porta do servidor
server.port=8080

# Desabilitar cache de recursos estáticos (JS, CSS, HTML)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
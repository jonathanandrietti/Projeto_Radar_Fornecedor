# Configurações de conexão com o banco de dados H2 (persistente em arquivo)
# Caminho: C:\Visão_Futura\Projeto_Radar_Fornecedor\radar\DBLRadar
spring.datasource.url=jdbc:h2:./DBLRadar;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações adicionais de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desabilitar carregamento automático de schema.sql e data.sql
spring.sql.init.mode=never

# Porta do servidor
server.port=8080

# Desabilitar cache de recursos estáticos (JS, CSS, HTML)
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# ===== H2 Console (Ferramentas de Banco de Dados) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

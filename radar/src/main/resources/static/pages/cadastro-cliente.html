<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente | Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen py-12 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- Cabeçalho -->
        <div class="text-center mb-10">
            <a href="/login.html" class="inline-flex items-center gap-3 font-black text-lg mb-6">
                <i class="fa-solid fa-arrow-left text-sky-600"></i>
                <span class="text-slate-600">Voltar</span>
            </a>
            <div class="flex justify-center mb-6">
                <div class="relative inline-block">
                    <div class="absolute -inset-1 bg-gradient-to-r from-sky-600 to-indigo-600 rounded-full blur opacity-30"></div>
                    <i class="fa-solid fa-satellite-dish relative text-5xl text-sky-600"></i>
                </div>
            </div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter uppercase">Cadastro de Cliente</h1>
            <p class="text-slate-600 mt-3 font-medium">Preencha seus dados para começar a explorar nosso catálogo</p>
        </div>

        <!-- Formulário -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
            <form id="form-cadastro" class="space-y-6">
                <!-- Seção: Informações Pessoais -->
                <div>
                    <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-user text-sky-600"></i>
                        Informações Pessoais
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <label class="campo">
                            <span class="font-black text-[10px] text-slate-400 uppercase">Nome Completo *</span>
                            <input type="text" id="nome" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="Seu nome completo">
                        </label>

                        <label class="campo">
                            <span class="font-black text-[10px] text-slate-400 uppercase">Tipo de Pessoa *</span>
                            <select id="tipoPessoa" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                                <option value="">Selecione...</option>
                                <option value="FISICA">Pessoa Física</option>
                                <option value="JURIDICA">Pessoa Jurídica</option>
                            </select>
                        </label>

                        <label class="campo">
                            <span class="font-black text-[10px] text-slate-400 uppercase">CPF/CNPJ *</span>
                            <input type="text" id="cpfCnpj" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="000.000.000-00" oninput="mascararCpfCnpj(this)">
                        </label>

                        <label class="campo">
                            <span class="font-black text-[10px] text-slate-400 uppercase">Email *</span>
                            <input type="email" id="email" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="seu@email.com">
                        </label>

                        <label class="campo">
                            <span class="font-black text-[10px] text-slate-400 uppercase">Telefone *</span>
                            <input type="tel" id="telefone" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="(00) 00000-0000" oninput="mascararTelefone(this)">
                        </label>
                    </div>
                </div>

                <hr class="border-slate-200">

                <!-- Seção: Endereço -->
                <div>
                    <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-location-dot text-sky-600"></i>
                        Endereço
                    </h2>
                    
                    <div class="grid grid-cols-1 gap-6">
                        <label class="campo">
                            <span class="font-black text-[10px] text-slate-400 uppercase">Rua/Avenida *</span>
                            <input type="text" id="endereco" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="Rua Principal, 123">
                        </label>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <label class="campo">
                                <span class="font-black text-[10px] text-slate-400 uppercase">Cidade *</span>
                                <input type="text" id="cidade" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="São Paulo">
                            </label>

                            <label class="campo">
                                <span class="font-black text-[10px] text-slate-400 uppercase">Estado *</span>
                                <select id="estado" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                                    <option value="">Selecione...</option>
                                    <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                                    <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                                    <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                                    <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                                    <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                                    <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                                    <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                                    <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                                    <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                                </select>
                            </label>

                            <label class="campo">
                                <span class="font-black text-[10px] text-slate-400 uppercase">CEP *</span>
                                <input type="text" id="cep" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none transition-all" placeholder="00000-000" oninput="mascararCep(this)">
                            </label>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-200">

                <!-- Seção: Foto de Perfil -->
                <div>
                    <h2 class="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-camera text-sky-600"></i>
                        Foto de Perfil
                    </h2>
                    
                    <div class="space-y-4">
                        <label class="flex flex-col items-center justify-center w-full p-6 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:border-sky-500 hover:bg-sky-50 transition-all">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-10 h-10 mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                <p class="mb-2 text-sm text-slate-700 font-semibold"><span class="font-black">Clique para enviar</span> ou arraste aqui</p>
                                <p class="text-xs text-slate-500">PNG, JPG ou GIF (máx. 5MB)</p>
                            </div>
                            <input type="file" id="foto" accept="image/*" class="hidden">
                        </label>

                        <div id="preview-foto" class="hidden text-center">
                            <img id="foto-preview" src="" alt="Preview" class="w-32 h-32 rounded-xl object-cover mx-auto shadow-lg mb-3">
                            <button type="button" id="remover-foto" class="text-sm font-bold text-rose-600 hover:text-rose-700">
                                <i class="fa-solid fa-trash mr-1"></i>Remover foto
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Mensagens de Erro -->
                <div id="erro-cadastro" class="hidden rounded-lg bg-rose-50 border border-rose-200 p-4 text-rose-800 text-sm">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i>
                    <span id="erro-texto"></span>
                </div>

                <!-- Botão de Submissão -->
                <button type="submit" class="w-full bg-gradient-to-r from-sky-600 to-sky-700 text-white font-black py-4 rounded-xl hover:shadow-xl transition-all duration-300 active:scale-95 uppercase tracking-widest text-sm">
                    <i class="fa-solid fa-check mr-2"></i>Criar Minha Conta
                </button>

                <!-- Link para Login -->
                <p class="text-center text-sm text-slate-600">
                    Já tem cadastro? <a href="/login.html" class="font-black text-sky-600 hover:text-sky-700">Faça login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        const inputFoto = document.getElementById('foto');
        const previewFoto = document.getElementById('preview-foto');
        const fotoPreview = document.getElementById('foto-preview');
        const removerFoto = document.getElementById('remover-foto');
        const formCadastro = document.getElementById('form-cadastro');
        const erroCadastro = document.getElementById('erro-cadastro');
        const erroTexto = document.getElementById('erro-texto');

        // Máscaras
        function mascararCpfCnpj(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length <= 11) {
                valor = valor.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else {
                valor = valor.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
            }
            input.value = valor;
        }

        function mascararTelefone(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 0) {
                valor = valor.replace(/(\d{2})(\d{4,5})(\d{4})/, '($1) $2-$3');
            }
            input.value = valor;
        }

        function mascararCep(input) {
            let valor = input.value.replace(/\D/g, '');
            if (valor.length > 0) {
                valor = valor.replace(/(\d{5})(\d{3})/, '$1-$2');
            }
            input.value = valor;
        }

        // Upload de foto
        document.querySelector('label[for="foto"]').addEventListener('dragover', (e) => {
            e.preventDefault();
            e.currentTarget.classList.add('border-sky-500', 'bg-sky-50');
        });

        document.querySelector('label[for="foto"]').addEventListener('dragleave', (e) => {
            e.currentTarget.classList.remove('border-sky-500', 'bg-sky-50');
        });

        document.querySelector('label[for="foto"]').addEventListener('drop', (e) => {
            e.preventDefault();
            e.currentTarget.classList.remove('border-sky-500', 'bg-sky-50');
            if (e.dataTransfer.files.length > 0) {
                inputFoto.files = e.dataTransfer.files;
                exibirPreview();
            }
        });

        inputFoto.addEventListener('change', exibirPreview);

        function exibirPreview() {
            if (inputFoto.files && inputFoto.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    fotoPreview.src = e.target.result;
                    previewFoto.classList.remove('hidden');
                };
                reader.readAsDataURL(inputFoto.files[0]);
            }
        }

        removerFoto.addEventListener('click', () => {
            inputFoto.value = '';
            previewFoto.classList.add('hidden');
        });

        // Submissão do formulário
        formCadastro.addEventListener('submit', async (e) => {
            e.preventDefault();
            erroCadastro.classList.add('hidden');

            const formData = new FormData();
            formData.append('nome', document.getElementById('nome').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('telefone', document.getElementById('telefone').value);
            formData.append('endereco', document.getElementById('endereco').value);
            formData.append('cidade', document.getElementById('cidade').value);
            formData.append('estado', document.getElementById('estado').value);
            formData.append('cep', document.getElementById('cep').value);
            formData.append('cpfCnpj', document.getElementById('cpfCnpj').value);
            formData.append('tipoPessoa', document.getElementById('tipoPessoa').value);
            
            if (inputFoto.files && inputFoto.files[0]) {
                formData.append('foto', inputFoto.files[0]);
            }

            try {
                const response = await fetch('/api/clientes/registrar', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Cadastro realizado com sucesso! Você será redirecionado para o login.');
                    window.location.href = '/login.html';
                } else {
                    const erro = await response.json();
                    erroTexto.textContent = erro.erro || 'Erro ao realizar cadastro. Tente novamente.';
                    erroCadastro.classList.remove('hidden');
                }
            } catch (err) {
                erroTexto.textContent = 'Erro na conexão com o servidor.';
                erroCadastro.classList.remove('hidden');
            }
        });

        // Validação de campos vazios
        document.querySelectorAll('input[required], select[required]').forEach(campo => {
            campo.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.classList.add('border-rose-500');
                } else {
                    this.classList.remove('border-rose-500');
                }
            });
        });
    </script>
</body>
</html>

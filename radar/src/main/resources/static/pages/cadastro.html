<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Radar Fornecedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body data-standalone="true" class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4 py-8">
        <div class="w-full max-w-2xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-3 mb-4">
                    <i class="fa-solid fa-satellite-dish text-[#d4af37] text-3xl"></i>
                    <h1 class="text-3xl font-black text-slate-900">RADAR</h1>
                </div>
                <p class="text-slate-600 text-sm">Sistema de Inteligência de Fornecedores - Cadastro</p>
            </div>

            <!-- Card Principal -->
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Solicitação de Cadastro</h2>
                    <p class="text-slate-600 text-sm">Preencha os dados abaixo para solicitar seu cadastro</p>
                </div>

                <form id="formularioCadastro" class="space-y-6">
                    <!-- Tipo de Cadastro -->
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="tipo" value="CNPJ" class="w-4 h-4 text-[#d4af37]" checked>
                            <span class="ml-3 text-slate-700 font-medium">CNPJ</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="tipo" value="CPF" class="w-4 h-4 text-[#d4af37]">
                            <span class="ml-3 text-slate-700 font-medium">CPF</span>
                        </label>
                    </div>

                    <!-- CNPJ/CPF com validação -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">CNPJ / CPF</label>
                        <div class="flex gap-2">
                            <input type="text" id="cnpjOuCpf" placeholder="00.000.000/0000-00" 
                                   maxlength="18" class="flex-1 px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                            <button type="button" id="btnValidar" class="px-4 py-3 bg-[#d4af37] text-white font-semibold rounded-lg hover:bg-[#c29a2f] transition">
                                <i class="fa-solid fa-check"></i> Validar
                            </button>
                        </div>
                        <div id="statusValidacao" class="mt-2 text-sm hidden"></div>
                    </div>

                    <!-- Nome da Empresa (CNPJ) / Nome Livre (CPF) -->
                    <div id="divNomeEmpresa">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Nome da Empresa</label>
                        <input type="text" id="nomeEmpresaOuPessoa" placeholder="Será preenchido automaticamente se CNPJ válido" 
                               class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]" readonly>
                    </div>

                    <!-- Nome de Contato -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Nome de Contato *</label>
                        <input type="text" id="nomeContato" placeholder="Nome da pessoa de contato" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                    </div>

                    <!-- E-mail -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">E-mail *</label>
                        <input type="email" id="email" placeholder="seu@email.com" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                    </div>

                    <!-- Telefone Fixo e Celular -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Telefone Fixo</label>
                            <input type="tel" id="telefoneFIXO" placeholder="(00) 0000-0000"
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Celular *</label>
                            <input type="tel" id="celular" placeholder="(00) 99999-9999" required
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                        </div>
                    </div>

                    <!-- WhatsApp -->
                    <div class="flex items-center">
                        <input type="checkbox" id="celularComWhatsapp" class="w-4 h-4 text-[#d4af37]">
                        <label for="celularComWhatsapp" class="ml-2 text-slate-700">O celular acima também possui WhatsApp?</label>
                    </div>

                    <!-- Tipo de Usuário/Perfil -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-3">Tipo de Perfil na Plataforma *</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:border-[#d4af37] hover:bg-amber-50 transition">
                                <input type="checkbox" id="perfilFornecedor" class="w-4 h-4 text-[#d4af37]">
                                <span class="ml-2 text-slate-700 font-medium">Fornecedor</span>
                            </label>
                            <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:border-[#d4af37] hover:bg-amber-50 transition">
                                <input type="checkbox" id="perfilRepresentante" class="w-4 h-4 text-[#d4af37]">
                                <span class="ml-2 text-slate-700 font-medium">Representante</span>
                            </label>
                            <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:border-[#d4af37] hover:bg-amber-50 transition">
                                <input type="checkbox" id="perfilComprador" class="w-4 h-4 text-[#d4af37]">
                                <span class="ml-2 text-slate-700 font-medium">Comprador</span>
                            </label>
                            <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:border-[#d4af37] hover:bg-amber-50 transition">
                                <input type="checkbox" id="perfilCliente" class="w-4 h-4 text-[#d4af37]">
                                <span class="ml-2 text-slate-700 font-medium">Cliente</span>
                            </label>
                        </div>
                        <p class="text-xs text-slate-500 mt-2">Você pode selecionar mais de um tipo</p>
                    </div>

                    <!-- Divisor -->
                    <hr class="border-slate-200">
                    <h3 class="text-lg font-bold text-slate-900 pt-2">Credenciais de Acesso</h3>

                    <!-- Usuário -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Usuário *</label>
                        <input type="text" id="usuario" placeholder="Escolha um usuário único" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                    </div>

                    <!-- Senha -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Senha *</label>
                        <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6"
                               class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                    </div>

                    <!-- Confirmar Senha -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Confirmar Senha *</label>
                        <input type="password" id="senhaConfirm" placeholder="Repita a senha" required
                               class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#d4af37]">
                    </div>

                    <!-- Mensagem de erro -->
                    <div id="mensagemErro" class="hidden p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>

                    <!-- Botões -->
                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 bg-[#d4af37] text-white font-bold py-3 rounded-lg hover:bg-[#c29a2f] transition">
                            <i class="fa-solid fa-paper-plane mr-2"></i> Enviar Solicitação
                        </button>
                        <a href="/login.html" class="flex-1 bg-slate-200 text-slate-700 font-bold py-3 rounded-lg hover:bg-slate-300 transition text-center">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Voltar
                        </a>
                    </div>
                </form>

                <!-- Link para Login -->
                <div class="text-center mt-6 pt-6 border-t border-slate-200">
                    <p class="text-slate-600 text-sm">Já possui cadastro?</p>
                    <a href="/login.html" class="text-[#d4af37] font-bold hover:underline">Faça login aqui</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('formularioCadastro');
        const btnValidar = document.getElementById('btnValidar');
        const inputCnpjCpf = document.getElementById('cnpjOuCpf');
        const statusValidacao = document.getElementById('statusValidacao');
        const nomeEmpresaInput = document.getElementById('nomeEmpresaOuPessoa');
        const radios = document.querySelectorAll('input[name="tipo"]');
        const mensagemErro = document.getElementById('mensagemErro');

        let cnpjOuCpfValido = false;
        let dadosEmpresa = {};

        // Mudar tipo CNPJ/CPF
        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                inputCnpjCpf.value = '';
                inputCnpjCpf.placeholder = radio.value === 'CNPJ' ? '00.000.000/0000-00' : '000.000.000-00';
                inputCnpjCpf.maxLength = radio.value === 'CNPJ' ? 18 : 14;
                statusValidacao.classList.add('hidden');
                nomeEmpresaInput.value = '';
                nomeEmpresaInput.readOnly = false;
                cnpjOuCpfValido = false;
                nomeEmpresaInput.placeholder = radio.value === 'CNPJ' ? 'Será preenchido automaticamente se CNPJ válido' : 'Nome livre';
            });
        });

        // Formatar entrada
        inputCnpjCpf.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            
            if (tipo === 'CNPJ') {
                value = value.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
            } else {
                value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            }
            
            e.target.value = value;
        });

        // Validar CNPJ/CPF ao sair do campo (blur) - Auto-preenche dados
        inputCnpjCpf.addEventListener('blur', async () => {
            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            const valor = inputCnpjCpf.value.replace(/\D/g, '');

            if (!valor || valor.length < 11) {
                return;  // Não valida se vazio ou incompleto
            }

            await validarCnpjCpfInterno(tipo, valor);
        });

        // Validar CNPJ/CPF
        btnValidar.addEventListener('click', async () => {
            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            const valor = inputCnpjCpf.value.replace(/\D/g, '');

            if (!valor) {
                mostrarStatus('Preencha o CNPJ/CPF', false);
                return;
            }

            await validarCnpjCpfInterno(tipo, valor);
        });

        // Função centralizada de validação
        async function validarCnpjCpfInterno(tipo, valor) {
            btnValidar.disabled = true;
            btnValidar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando...';

            try {
                const response = await fetch('/api/validacao/validar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo, valor })
                });

                const data = await response.json();

                if (data.valido) {
                    cnpjOuCpfValido = true;
                    dadosEmpresa = data;

                    if (tipo === 'CNPJ' && data.dadosDisponiveis) {
                        // Auto-preencher dados da empresa
                        nomeEmpresaInput.value = data.nomeEmpresa;
                        nomeEmpresaInput.readOnly = true;
                        
                        // Auto-preencher telefone se disponível
                        if (data.telefone) {
                            document.getElementById('telefoneFIXO').value = data.telefone;
                        }
                        
                        // Auto-preencher email se disponível
                        if (data.email) {
                            document.getElementById('email').value = data.email;
                        }
                        
                        mostrarStatus('✓ CNPJ válido! Dados preenchidos automaticamente.', true);
                    } else if (tipo === 'CNPJ') {
                        mostrarStatus('✓ CNPJ válido! Preencha o nome da empresa manualmente.', true);
                        nomeEmpresaInput.readOnly = false;
                    } else {
                        mostrarStatus('✓ CPF válido!', true);
                    }
                } else {
                    cnpjOuCpfValido = false;
                    mostrarStatus('✗ ' + data.mensagem, false);
                }
            } catch (e) {
                cnpjOuCpfValido = false;
                mostrarStatus('Erro ao validar: ' + e.message, false);
            } finally {
                btnValidar.disabled = false;
                btnValidar.innerHTML = '<i class="fa-solid fa-check"></i> Validar';
            }
        }

        function mostrarStatus(msg, valido) {
            statusValidacao.textContent = msg;
            statusValidacao.classList.remove('hidden');
            statusValidacao.className = `mt-2 text-sm ${valido ? 'text-green-600' : 'text-red-600'}`;
        }

        // Submeter formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensagemErro.classList.add('hidden');

            // Validações
            if (!cnpjOuCpfValido) {
                mostrarErro('Valide o CNPJ/CPF antes de enviar');
                return;
            }

            const senha = document.getElementById('senha').value;
            const senhaConfirm = document.getElementById('senhaConfirm').value;

            if (senha !== senhaConfirm) {
                mostrarErro('As senhas não coincidem');
                return;
            }

            if (senha.length < 6) {
                mostrarErro('Senha deve ter no mínimo 6 caracteres');
                return;
            }

            // Validar se pelo menos um perfil foi selecionado
            const fornecedor = document.getElementById('perfilFornecedor').checked;
            const representante = document.getElementById('perfilRepresentante').checked;
            const comprador = document.getElementById('perfilComprador').checked;
            const cliente = document.getElementById('perfilCliente').checked;

            if (!fornecedor && !representante && !comprador && !cliente) {
                mostrarErro('Selecione pelo menos um tipo de perfil');
                return;
            }

            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            const cnpjOuCpf = document.getElementById('cnpjOuCpf').value.replace(/\D/g, '');

            const dados = {
                tipo,
                cnpjOuCpf,
                nomeEmpresaOuPessoa: document.getElementById('nomeEmpresaOuPessoa').value,
                nomeContato: document.getElementById('nomeContato').value,
                email: document.getElementById('email').value,
                telefoneFIXO: document.getElementById('telefoneFIXO').value,
                celular: document.getElementById('celular').value,
                celularComWhatsapp: document.getElementById('celularComWhatsapp').checked,
                usuario: document.getElementById('usuario').value,
                senha: document.getElementById('senha').value,
                fornecedor: document.getElementById('perfilFornecedor').checked,
                representante: document.getElementById('perfilRepresentante').checked,
                comprador: document.getElementById('perfilComprador').checked,
                cliente: document.getElementById('perfilCliente').checked
            };

            try {
                const response = await fetch('/api/cadastro/solicitar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (response.ok) {
                    alert('✓ Solicitação enviada com sucesso!\nAguarde a aprovação do administrador.');
                    // Redireciona para página de login
                    window.location.href = '/login.html';
                } else {
                    console.error('[CADASTRO] Erro:', resultado);
                    mostrarErro(resultado.erro || 'Erro ao enviar solicitação');
                }
            } catch (e) {
                console.error('[CADASTRO] Exception:', e);
                mostrarErro('Erro de conexão: ' + e.message);
            }
        });

        function mostrarErro(msg) {
            mensagemErro.textContent = msg;
            mensagemErro.classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>

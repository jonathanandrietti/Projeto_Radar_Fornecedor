<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Fornecedor</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #0ea5e9;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text {
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
    <script>
        async function verificarSessao() {
            try {
                const resposta = await fetch('/api/login/session');
                if (resposta.ok) {
                    const user = await resposta.json();
                    let url = '';
                    switch (user.tipo) {
                        case 'FORNECEDOR':
                            url = '/pages/fornecedores.html';
                            break;
                        case 'COMPRADOR':
                            url = '/pages/compradores.html';
                            break;
                        case 'REPRESENTANTE':
                            url = '/pages/representantes.html';
                            break;
                        case 'CLIENTE':
                            url = '/pages/clientes.html';
                            break;
                        case 'ADMIN':
                            url = '/pages/admin.html';
                            break;
                        default:
                            url = '/pages/fornecedores.html';
                    }
                    window.location.href = url;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (erro) {
                console.error('Erro ao verificar sessão:', erro);
                window.location.href = '/login.html';
            }
        }
        window.addEventListener('DOMContentLoaded', verificarSessao);
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="text">Verificando sessão...</div>
    </div>
</body>
</html>

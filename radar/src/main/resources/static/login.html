<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            background: url('/imagem/FundoHAIE.png') no-repeat center center fixed !important;
            background-size: cover !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat" style="background-image: url('/imagem/FundoHAIE.png');">
    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <img src="/imagem/Logo.png" alt="Logo Radar" class="mx-auto w-24 h-24 mb-4 object-contain rounded-full shadow-md">
            <h1 class="text-3xl font-black text-slate-900"><i class="fa-solid fa-satellite-dish text-sky-600 mr-2"></i>RADAR</h1>
            <p class="text-slate-500 mt-2">Selecione seu tipo de acesso e faça login</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Usuário</label>
                <input type="text" id="username" required class="w-full rounded-lg border px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Senha</label>
                <input type="password" id="senha" required class="w-full rounded-lg border px-4 py-3 focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            
            <div id="erro" class="hidden text-red-500 text-sm font-semibold text-center">
                Usuário ou senha inválidos.
            </div>

            <button type="submit" class="w-full bg-sky-600 text-white font-bold py-3 rounded-lg hover:bg-sky-700 transition duration-200 shadow-lg">
                Entrar
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400 uppercase font-bold tracking-widest mb-4">Tipos de Acesso</p>
            <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                <div class="p-2 bg-slate-50 rounded border text-slate-600">Fornecedor</div>
                <div class="p-2 bg-slate-50 rounded border text-slate-600">Comprador</div>
                <div class="p-2 bg-slate-50 rounded border text-slate-600">Representante</div>
                <div class="p-2 bg-slate-50 rounded border text-slate-600">Cliente</div>
            </div>
        </div>
    </div>

    <script>
        console.log('script de login carregado!');
        document.querySelector('#loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('Formulário submetido!');
            const username = document.getElementById('username').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('erro');
            
            if (!username || !senha) {
                erro.textContent = 'Preencha usuário e senha.';
                erro.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, senha })
                });
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const user = await response.json();
                    console.log('User logado:', user);
                    localStorage.setItem('usuario', JSON.stringify(user));
                    
                    // Redirecionar de acordo com o tipo de usuário
                    const tipo = user.tipo;
                    let url = '';
                    
                    switch (tipo) {
                        case 'FORNECEDOR':
                            url = '/pages/fornecedores.html';
                            break;
                        case 'COMPRADOR':
                            url = '/pages/compradores.html';
                            break;
                        case 'REPRESENTANTE':
                            url = '/pages/representantes.html';
                            break;
                        case 'CLIENTE':
                            url = '/pages/clientes.html';
                            break;
                        case 'ADMIN':
                            url = '/pages/admin.html';
                            break;
                        default:
                            url = '/pages/fornecedores.html';
                    }
                    
                    console.log('Redirecionando para:', url);
                    window.location.href = url;
                } else {
                    console.log('Login falhou, status:', response.status);
                    erro.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Erro ao fazer login:', err);
                alert('Erro na conexão com o servidor.');
            }
        });
    </script>
</body>
</html>

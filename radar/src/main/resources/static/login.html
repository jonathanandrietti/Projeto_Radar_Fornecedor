<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="fixed inset-0 bg-black/30 backdrop-blur-[1.5px] z-0"></div>

    <div class="relative z-10 w-full max-w-[430px] mx-auto">
        <div class="login-card w-full bg-white/95 border border-slate-200/80 rounded-[30px] shadow-[0_24px_80px_rgba(15,23,42,0.18)] px-5 py-7 sm:px-8 sm:py-8 md:px-9 md:py-8">
            <div class="text-center mb-7 sm:mb-8">
                <div class="relative inline-flex items-center justify-center mb-4">
                    <div class="absolute inset-0 rounded-full bg-[#d4af37]/15 blur-md"></div>
                    <img src="/imagem/Logo.png" alt="Logo Radar" class="relative w-[5.2rem] h-[5.2rem] object-contain rounded-full shadow-[0_8px_20px_rgba(15,23,42,0.08)]">
                </div>
                <h1 class="flex items-center justify-center gap-2 text-[2rem] font-black tracking-[0.08em] text-slate-900 uppercase">
                    <i class="fa-solid fa-satellite-dish text-[#d4af37] text-[1.4rem] leading-none"></i>
                    <span>RADAR</span>
                </h1>
                <p class="mt-2 text-[10px] font-semibold uppercase tracking-[0.28em] text-slate-500">Sistema de Inteligência de Fornecedores</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <p class="-mt-1 mb-1 text-sm font-medium text-slate-600">Acesse sua conta</p>

                <div class="campo">
                    <label class="text-[11px] font-bold text-slate-600">Usuário</label>
                    <div class="relative">
                        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[0.95rem] leading-none">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required class="w-full rounded-2xl border border-slate-200 bg-slate-50/80 py-3.5 pl-11 pr-4 text-sm text-slate-800 shadow-sm transition-all duration-200 focus:border-[#d4af37] focus:bg-white focus:ring-4 focus:ring-[#d4af37]/10 outline-none" placeholder="Digite seu usuário">
                    </div>
                </div>

                <div class="campo">
                    <label class="text-[11px] font-bold text-slate-600">Senha</label>
                    <div class="relative">
                        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[0.95rem] leading-none">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="senha" required class="w-full rounded-2xl border border-slate-200 bg-slate-50/80 py-3.5 pl-11 pr-4 text-sm text-slate-800 shadow-sm transition-all duration-200 focus:border-[#d4af37] focus:bg-white focus:ring-4 focus:ring-[#d4af37]/10 outline-none" placeholder="Digite sua senha">
                    </div>
                </div>

                <div id="erro" class="hidden animate-bounce text-rose-600 text-xs font-black text-center bg-rose-50 py-2 rounded-xl border border-rose-100">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Usuário ou senha incorretos.
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-slate-950 via-slate-900 to-[#0f172a] text-white font-black py-3.5 rounded-2xl shadow-[0_10px_20px_rgba(15,23,42,0.18)] transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_12px_24px_rgba(15,23,42,0.22)] active:scale-[0.99] uppercase tracking-[0.18em] text-xs sm:text-sm focus:outline-none focus:ring-4 focus:ring-slate-300">
                    ENTRAR
                </button>
            </form>

            <!-- Botão CADASTRO FORA do form para não fazer submit -->
            <a href="/pages/cadastro.html" class="w-full block text-center bg-gradient-to-r from-[#d4af37] to-[#c29a2f] text-slate-900 font-black py-3.5 rounded-2xl shadow-[0_10px_20px_rgba(212,175,55,0.18)] transition-all duration-200 hover:-translate-y-0.5 hover:shadow-[0_12px_24px_rgba(212,175,55,0.22)] active:scale-[0.99] uppercase tracking-[0.18em] text-xs sm:text-sm focus:outline-none focus:ring-4 focus:ring-[#d4af37]/30">
                <i class="fa-solid fa-user-plus mr-2"></i> CADASTRO
            </a>

            <div class="mt-8 pt-6 border-t border-slate-200 text-center">
                <p class="mb-5 text-[10px] text-slate-500 uppercase font-black tracking-[0.25em]">Módulos Disponíveis</p>
                <div class="grid grid-cols-2 gap-3 sm:gap-4">
                    <div class="module-card flex flex-col items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-slate-50/80 px-2.5 py-3.5 text-center shadow-[0_1px_2px_rgba(15,23,42,0.04)] transition-all duration-200 ease-out">
                        <i class="fa-solid fa-truck-fast text-[1.3rem] leading-none text-[#d4af37]"></i>
                        <div class="space-y-1">
                            <span class="module-name block text-[9px] font-black tracking-[0.08em] text-slate-700 uppercase">Fornecedor</span>
                            <span class="block text-[7.5px] leading-relaxed text-slate-500">Gestão de fornecedores</span>
                        </div>
                    </div>
                    <div class="module-card flex flex-col items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-slate-50/80 px-2.5 py-3.5 text-center shadow-[0_1px_2px_rgba(15,23,42,0.04)] transition-all duration-200 ease-out">
                        <i class="fa-solid fa-cart-shopping text-[1.3rem] leading-none text-[#d4af37]"></i>
                        <div class="space-y-1">
                            <span class="module-name block text-[9px] font-black tracking-[0.08em] text-slate-700 uppercase">Comprador</span>
                            <span class="block text-[7.5px] leading-relaxed text-slate-500">Gestão de compras</span>
                        </div>
                    </div>
                    <div class="module-card flex flex-col items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-slate-50/80 px-2.5 py-3.5 text-center shadow-[0_1px_2px_rgba(15,23,42,0.04)] transition-all duration-200 ease-out">
                        <i class="fa-solid fa-user-tie text-[1.3rem] leading-none text-[#d4af37]"></i>
                        <div class="space-y-1">
                            <span class="module-name block text-[9px] font-black tracking-[0.08em] text-slate-700 uppercase">Representante</span>
                            <span class="block text-[7.5px] leading-relaxed text-slate-500">Gestão comercial</span>
                        </div>
                    </div>
                    <div class="module-card flex flex-col items-center justify-center gap-2 rounded-2xl border border-slate-200 bg-slate-50/80 px-2.5 py-3.5 text-center shadow-[0_1px_2px_rgba(15,23,42,0.04)] transition-all duration-200 ease-out">
                        <i class="fa-solid fa-users text-[1.3rem] leading-none text-[#d4af37]"></i>
                        <div class="space-y-1">
                            <span class="module-name block text-[9px] font-black tracking-[0.08em] text-slate-700 uppercase">Cliente</span>
                            <span class="block text-[7.5px] leading-relaxed text-slate-500">Relacionamento com clientes</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('#loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('erro');
            
            erro.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, senha })
                });

                if (response.ok) {
                    const user = await response.json();
                    localStorage.setItem('usuario', JSON.stringify(user));
                    
                    // ✅ ADMIN sempre vai para página de administração
                    if (user.tipo === 'ADMIN') {
                        window.location.href = '/pages/admin.html';
                        return;
                    }
                    
                    // ✅ Se cadastro incompleto, vai para página de finalização
                    if (user.cadastroCompleto === false) {
                        // Determinar qual página de finalização baseado nos perfis
                        if (user.fornecedor) {
                            window.location.href = '/pages/fornecedores.html?finalizar=true';
                        } else if (user.comprador) {
                            window.location.href = '/pages/compradores.html?finalizar=true';
                        } else if (user.representante) {
                            window.location.href = '/pages/representantes.html?finalizar=true';
                        } else if (user.cliente) {
                            window.location.href = '/pages/clientes.html?finalizar=true';
                        } else {
                            window.location.href = '/pages/produtos.html'; // Padrão
                        }
                        return;
                    }
                    
                    // ✅ Cadastro completo - vai para página principal do perfil
                    if (user.fornecedor) {
                        window.location.href = '/pages/fornecedores.html';
                    } else if (user.comprador) {
                        window.location.href = '/pages/compradores.html';
                    } else if (user.representante) {
                        window.location.href = '/pages/representantes.html';
                    } else if (user.cliente) {
                        window.location.href = '/pages/clientes.html';
                    } else {
                        window.location.href = '/pages/produtos.html';
                    }
                } else {
                    // Ler a mensagem de erro do servidor
                    const errorData = await response.json();
                    const mensagem = errorData.erro || 'Erro ao fazer login';
                    
                    // Atualizar mensagem de erro dinamicamente
                    erro.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1"></i> ${mensagem}`;
                    erro.classList.remove('hidden');
                }
            } catch (err) {
                alert('Erro na conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
